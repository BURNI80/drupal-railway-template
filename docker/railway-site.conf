# Railway vhost — serves the composer docroot of the official Drupal image.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /opt/drupal/web

    <Directory /opt/drupal/web>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Railway healthcheck: map /healthz (no extension) to healthz.php.
    Alias /healthz /opt/drupal/web/healthz.php
    <Location /healthz>
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
