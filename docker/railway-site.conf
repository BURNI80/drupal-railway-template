# Railway vhost — serves the composer docroot of the official Drupal image.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /opt/drupal/web

    <Directory /opt/drupal/web>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Railway healthcheck: map /healthz (no extension) to healthz.php.
    # Using a RewriteRule here (instead of Alias) so it wins over Drupal's
    # .htaccess which would otherwise route /healthz into Drupal and return 404.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/healthz/?$
    RewriteRule ^healthz /opt/drupal/web/healthz.php [L,PT]

    <Location /healthz>
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
